name: Tests et mise en ligne

# Branche jetable diag-counter-webkit : seulement le diagnostic du compteur caméra sous WebKit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Diagnostic ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: crash-a
          - name: crash-b
          - name: crash-c
          - name: crash-d
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: npm ci

      - name: Build
        run: npm run build

      - name: Navigateurs de test
        run: npx playwright install --with-deps chromium webkit

      - name: Tests
        run: |
          (while true; do echo "MEM $(date +%T) $(free -m | awk '/Mem/ {print $3"/"$2}')"; sleep 20; done) &
          DEBUG=pw:browser npx playwright test --project=iphone-webkit-camera --no-deps --repeat-each=3 --retries=0 > run.log 2>&1 || true
          grep -E "✘|✓|passed|failed|DIAGDUMP" run.log | cut -c1-300
          echo "---- lignes du navigateur (sans doublons)"
          grep -E "\[err\]|\[out\]" run.log | sed -E 's/.*\]\[(err|out)\]//' | sort | uniq -c | sort -rn | head -60 | cut -c1-300
          echo "---- autour des plantages"
          grep -n -iE "crash|SIG[A-Z]+|segmentation|abort|assert|killed|out of memory" run.log | head -40 | cut -c1-400
          for n in $(grep -n -iE "Target crashed|crashed" run.log | head -3 | cut -d: -f1); do echo "== avant la ligne $n"; sed -n "$((n-40)),$((n+2))p" run.log | cut -c1-300; done
          echo "---- dmesg"
          sudo dmesg | tail -40
        env:
          CI: 'true'
