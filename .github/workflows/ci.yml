name: Tests et mise en ligne

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatage
        run: npm run format:check

      - name: Tests unitaires
        run: npm run test

      - name: Build
        run: npm run build

      - name: Navigateurs de test
        run: npx playwright install --with-deps chromium webkit

      - name: Tests de bout en bout
        run: npm run e2e
        env:
          CI: 'true'
          # Temporaire : sorties des navigateurs, pour comprendre les plantages de WebKit.
          DEBUG: pw:browser

      - name: Diagnostic WebKit (temporaire)
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import glob, json, zipfile

          for path in sorted(glob.glob('test-results/*webkit*/trace.zip')):
              print('=====', path)
              with zipfile.ZipFile(path) as z:
                  for name in z.namelist():
                      if name.endswith('-trace.trace'):
                          events = [json.loads(line) for line in z.read(name).decode('utf8', 'replace').splitlines()]
                          shown = []
                          for ev in events:
                              kind = ev.get('type')
                              if kind == 'before':
                                  params = ev.get('params', {})
                                  shown.append(f"{ev.get('startTime', 0):10.0f} call {ev.get('method')} {params.get('url', '')}{params.get('selector', '')}"[:220])
                              elif kind == 'after' and ev.get('error'):
                                  shown.append(f"{ev.get('endTime', 0):10.0f} error {json.dumps(ev.get('error'))}"[:300])
                              elif kind == 'log':
                                  shown.append(f"{ev.get('time', 0):10.0f} log {ev.get('message')}"[:220])
                              elif kind in ('console', 'event'):
                                  shown.append(f"{ev.get('time', 0):10.0f} {kind} {ev.get('messageType', '')} {ev.get('method', '')} {ev.get('text', '')} {json.dumps(ev.get('params', ''))}"[:300])
                          print('\n'.join(shown[-45:]))
                      elif name.endswith('-trace.network'):
                          print('--- réseau (fin)')
                          for line in z.read(name).decode('utf8', 'replace').splitlines()[-30:]:
                              snap = json.loads(line).get('snapshot', {})
                              response = snap.get('response', {})
                              date = next((h['value'] for h in response.get('headers', []) if h['name'].lower() == 'date'), '')
                              print(snap.get('startedDateTime'), round(snap.get('time', 0)), response.get('status'),
                                    snap.get('request', {}).get('url'), date, response.get('_failureText', ''))
          PYEOF

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Paquet GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Mise en ligne
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
