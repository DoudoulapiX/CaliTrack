name: Tests et mise en ligne

# Branche jetable diag-counter-webkit : seulement le diagnostic du compteur caméra sous WebKit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Diagnostic ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mediapipe-a
            cmd: npx playwright test e2e/rep-counter-mediapipe.spec.ts --project=iphone-webkit-camera --no-deps --repeat-each=5 --retries=0
          - name: mediapipe-b
            cmd: npx playwright test e2e/rep-counter-mediapipe.spec.ts --project=iphone-webkit-camera --no-deps --repeat-each=5 --retries=0
          - name: mediapipe-c
            cmd: npx playwright test e2e/rep-counter-mediapipe.spec.ts --project=iphone-webkit-camera --no-deps --repeat-each=5 --retries=0
          - name: camera-a
            cmd: npx playwright test --project=iphone-webkit-camera --no-deps --repeat-each=3 --retries=0
          - name: camera-b
            cmd: npx playwright test --project=iphone-webkit-camera --no-deps --repeat-each=3 --retries=0
          - name: suite-c
            cmd: npx playwright test --retries=0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: npm ci

      - name: Build
        run: npm run build

      - name: Navigateurs de test
        run: npx playwright install --with-deps chromium webkit

      - name: Tests
        run: ${{ matrix.cmd }}
        env:
          CI: 'true'
