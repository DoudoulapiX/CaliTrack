name: Tests et mise en ligne

# Branche jetable diag-counter-webkit : seulement le diagnostic du compteur caméra sous WebKit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Diagnostic ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sonde-30
            draw: '30'
            cmd: npx playwright test e2e/diag-mp.spec.ts --project=iphone-webkit --no-deps --workers=1 --retries=0
          - name: sonde-10
            draw: '10'
            cmd: npx playwright test e2e/diag-mp.spec.ts --project=iphone-webkit --no-deps --workers=1 --retries=0
          - name: mediapipe-seul-30
            draw: '30'
            cmd: npx playwright test e2e/rep-counter-mediapipe.spec.ts --project=iphone-webkit-camera --no-deps --workers=1 --repeat-each=4 --retries=0
          - name: mediapipe-seul-10
            draw: '10'
            cmd: npx playwright test e2e/rep-counter-mediapipe.spec.ts --project=iphone-webkit-camera --no-deps --workers=1 --repeat-each=4 --retries=0
          - name: suite-a
            draw: '30'
            cmd: npx playwright test --retries=0
          - name: suite-b
            draw: '30'
            cmd: npx playwright test --retries=0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: npm ci

      - name: Build
        run: npm run build

      - name: Navigateurs de test
        run: npx playwright install --with-deps chromium webkit

      - name: Tests
        run: ${{ matrix.cmd }}
        env:
          CI: 'true'
          DIAG_DRAW_FPS: ${{ matrix.draw }}
          DIAG_SONDE: ${{ startsWith(matrix.name, 'sonde') && '1' || '' }}
